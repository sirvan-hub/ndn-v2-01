        .gold-glow {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);

<body class="bg-background text-on-surface font-body-sm min-h-screen flex flex-col">
<!-- Top Navigation (Transactional/Linear flow, keeping it minimal) -->
<header class="w-full top-0 sticky border-b border-outline-variant dark:border-outline-variant bg-background dark:bg-background flex justify-between items-center px-margin-mobile py-base z-10">
<div class="flex items-center gap-2">
<button class="text-primary dark:text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined font-headline-sm text-headline-sm-mobile">arrow_forward</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile font-bold text-primary dark:text-primary tracking-tight">ثبت‌نام سفیر جدید</h1>
</div>
<img alt="NDN Logo" class="h-8 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsjzfLTwVmAKHoVMtryjnkDJDwb5IF-dTEtk9-WI1zbCdo6rcoEXTChyiIH8NhT7iVS-iGbG7RO88sIAulDmAaSnjwxcx4gYDpx-D1iCE5pzABdypB4Bz2XLYl-w7PROZy6BorNr-KRuiXRoAAzoEKYJJBZByeP4nMvnKlqTD9NMLBrOFCmDc0kbYxCV-AH8rlqGqznxRh-fPkGJPQcpZ6NRW-x-biu_2sSt3JU3rbcHwlNa9535jRZWASDZa5ZT4O2f4"/>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-lg max-w-3xl mx-auto w-full flex flex-col gap-xl">
<!-- Progress Tracker -->
<section class="flex flex-col gap-sm">
<div class="flex justify-between items-center font-label-md text-label-md text-on-surface-variant">
<span>مرحله ۲ از ۲</span>
<span>تکمیل مدارک</span>
</div>
<div class="w-full h-1 bg-surface-container-highest rounded-full overflow-hidden flex">
<div class="w-1/2 h-full bg-primary-container"></div>
<div class="w-1/2 h-full bg-primary-container"></div>
</div>
</section>
<!-- Form Section -->
<form class="flex flex-col gap-lg flex-grow">
<!-- Identity Info Cards (Bento style grid) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- National ID -->
<div class="bg-surface-elevation-1 border border-outline-variant rounded-xl p-md flex flex-col gap-xs focus-within:border-primary-container transition-colors">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="national_id">کد ملی</label>
<input class="bg-transparent border-none text-high-contrast-text font-label-md text-label-md p-0 focus:ring-0 focus:outline-none placeholder-surface-variant text-left" dir="ltr" id="national_id" placeholder="0000000000" type="text"/>
</div>
<!-- Bank Card -->
<div class="bg-surface-elevation-1 border border-outline-variant rounded-xl p-md flex flex-col gap-xs focus-within:border-primary-container transition-colors">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="bank_card">شماره کارت بانکی</label>
<input class="bg-transparent border-none text-high-contrast-text font-label-md text-label-md p-0 focus:ring-0 focus:outline-none placeholder-surface-variant text-left tracking-widest" dir="ltr" id="bank_card" placeholder="0000 0000 0000 0000" type="text"/>
</div>
</div>
<!-- Upload Section -->
<div class="flex flex-col gap-md mt-sm">
<h2 class="font-headline-sm text-headline-sm text-high-contrast-text">مدارک هویتی</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- National ID Upload -->
<label class="file-upload-label bg-surface-elevation-1 border border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm hover:border-primary-container transition-colors min-h-[160px]">
<span class="material-symbols-outlined text-primary-container text-[40px]">id_card</span>
<span class="font-body-md text-body-md text-on-surface-variant text-center">آپلود تصویر کارت ملی</span>
<span class="font-label-sm text-label-sm text-tertiary-container">فرمت‌های مجاز: JPG, PNG</span>
<input accept="image/png, image/jpeg" type="file"/>
</label>
<!-- Profile Photo Upload -->
<label class="file-upload-label bg-surface-elevation-1 border border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm hover:border-primary-container transition-colors min-h-[160px]">
<span class="material-symbols-outlined text-primary-container text-[40px]">account_circle</span>
<span class="font-body-md text-body-md text-on-surface-variant text-center">آپلود عکس پرسنلی</span>
<span class="font-label-sm text-label-sm text-tertiary-container">زمینه سفید، واضح</span>
<input accept="image/png, image/jpeg" type="file"/>
</label>
</div>
</div>
<!-- Spacer to push button down if needed -->
<div class="flex-grow"></div>
<!-- Submit Button Area (Pinned to bottom on mobile, inline on desktop) -->
<div class="mt-xl md:mt-0 pb-safe">
<button class="w-full bg-primary-container text-[#000000] font-headline-sm text-headline-sm py-sm rounded-lg gold-glow hover:opacity-90 active:scale-95 transition-all flex justify-center items-center gap-xs" type="button">
<span>تکمیل ثبت‌نام و بررسی مدارک</span>
<span class="material-symbols-outlined">check_circle</span>
</button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-sm">
                    با ثبت‌نام، شما قوانین شبکه تحویل مطمئن محله (NDN) را می‌پذیرید.
                </p>
</div>
</form>
</main>
