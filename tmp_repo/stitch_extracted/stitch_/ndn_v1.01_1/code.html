<style>
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        }
        .biometric-glow {
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Header / Nav (Minimal) -->
<header class="absolute top-0 w-full flex items-center justify-between p-margin-mobile z-10">
<button aria-label="Back" class="text-on-surface-variant hover:text-primary transition-colors p-xs">
<span class="material-symbols-outlined text-headline-sm">arrow_forward</span>
</button>
<div class="flex items-center justify-center">
<img alt="NDN Logo" class="h-10 w-auto opacity-80" data-alt="NDN logistics high-end gold logo on dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZQc9waLEbptMdXj1VGyW0HyUTmoY9jI7NSCIjScAQ0BqCLh3-JTfbaFjsAh5W9MjRdpv1sRgUZIqqQ-OxLRisxX6vF8FwmF9eSi7TBKUSyatGjmMrCHnLsHIgqtk9RCtAqcVcBUnCn6Wc2eybD4wLcB76UCQqxfbxZWReB6Up40rPvWcIkInuUf0tsZCFi_W3dy699RaenHaqJ5COTLTu0CLhLztHlXfARpIP2yJWuFz5uCJ5p2N9zUcZgMH4svStg5I"/>
</div>
<div class="w-8"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-md mx-auto flex flex-col items-center justify-center px-margin-mobile relative z-0">
<!-- Fingerprint / Biometric Visual -->
<div class="relative w-48 h-48 flex items-center justify-center mb-xl">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border border-primary/20 pulse-ring"></div>
<div class="absolute inset-4 rounded-full border border-primary/40 pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Fingerprint Icon Container -->
<div class="relative z-10 bg-surface-elevation-1 rounded-full p-lg border border-outline-variant shadow-[0_0_30px_rgba(212,175,55,0.15)] biometric-glow flex items-center justify-center cursor-pointer transition-transform hover:scale-105 active:scale-95" data-field="biometric_sensor">
<span class="material-symbols-outlined text-[80px] text-primary" style="font-variation-settings: 'FILL' 0, 'wght' 300;">
                    fingerprint
                </span>
</div>
</div>
<!-- Status & Context -->
<div class="text-center mb-xl space-y-sm">
<h1 class="font-headline-sm text-headline-sm text-high-contrast-text" data-field="status_text">
                لطفاً انگشت خود را روی سنسور قرار دهید
            </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px] mx-auto">
                امنیت شما اولویت ماست. ورود امن به پنل اختصاصی.
            </p>
</div>
</main>
<!-- Bottom Action Area (Simulated Bottom Sheet / Fallback) -->
<div class="w-full max-w-md mx-auto px-margin-mobile pb-margin-mobile z-10 absolute bottom-0">
<div class="bg-surface-elevation-1 border border-outline-variant rounded-t-xl rounded-b-xl p-md flex flex-col items-center gap-md shadow-[0_-8px_24px_rgba(0,0,0,0.5)]">
<div class="w-12 h-1 bg-surface-variant rounded-full mb-xs"></div>
<button class="w-full flex items-center justify-center gap-xs py-sm text-on-surface-variant hover:text-primary transition-colors font-label-md text-label-md border border-transparent hover:border-outline-variant rounded-lg">
<span class="material-symbols-outlined text-label-md">password</span>

             </button>
</div>
